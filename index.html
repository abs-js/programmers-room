<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmer's Room</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="src/imgs/favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
      <div class="auth-container">
        <h1>Programmer's Room</h1>
        <p class="tagline">O seu espaço para código, projetos e colaboração</p>
        <div class="tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="register">Criar Conta</button>
        </div>
        <div id="login-form" class="form-panel active">
          <input type="email" id="login-email" placeholder="E-mail" required>
          <input type="password" id="login-password" placeholder="Senha" required>
          <button id="login-btn">Entrar</button>
          <p id="login-error" class="error"></p>
        </div>
        <div id="register-form" class="form-panel">
          <input type="text" id="reg-nick" placeholder="Nickname" required>
          <input type="email" id="reg-email" placeholder="E-mail" required>
          <input type="password" id="reg-password" placeholder="Senha (mín. 8 caracteres)" required>
          <input type="password" id="reg-password2" placeholder="Confirmar senha" required>
          <input type="text" id="reg-github" placeholder="GitHub (opcional)">
          <label>Data de nascimento:</label>
          <input type="date" id="reg-birth" required>
          <label>Avatar (imagem pequena):</label>
          <input type="file" id="reg-avatar" accept="image/*">
          <img id="avatar-preview" style="max-width:80px; display:none;">
          <div class="captcha">
            <span id="captcha-question"></span>
            <input type="number" id="captcha-answer" placeholder="Resposta">
          </div>
          <button id="register-btn">Criar Conta</button>
          <p id="reg-error" class="error"></p>
          <div id="email-verify" style="display:none;">
            <p>Código de verificação (demo - em produção enviado por e-mail):</p>
            <strong id="demo-code"></strong>
            <input type="text" id="verify-code" placeholder="Código de 8 dígitos" maxlength="8">
            <button id="verify-btn">Verificar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Setup (after register) -->
    <div id="setup-screen" class="screen">
      <div class="setup-container">
        <h2>Complete seu perfil</h2>
        <label>Linguagem preferida:</label>
        <select id="pref-lang"></select>
        <label>Linguagem secundária:</label>
        <select id="sec-lang"></select>
        <label>Bio curta:</label>
        <textarea id="bio" maxlength="160" placeholder="Fale um pouco sobre você..."></textarea>
        <label>Descrição do perfil:</label>
        <textarea id="desc" placeholder="Mais detalhes..."></textarea>
        <label>Tags de projetos (opcional, separadas por vírgula):</label>
        <input type="text" id="proj-tags" placeholder="web, game, ai, ...">
        <label>Engine preferida:</label>
        <select id="engine">
          <option value="none">Nenhum</option>
          <option value="godot">Godot</option>
          <option value="unreal">Unreal Engine</option>
          <option value="unity">Unity</option>
          <option value="other">Outro</option>
        </select>
        <label>Outras contas (opcional):</label>
        <input type="text" id="social-fb" placeholder="Facebook">
        <input type="text" id="social-yt" placeholder="YouTube">
        <input type="text" id="social-chatgpt" placeholder="ChatGPT / outros">
        <input type="text" id="editor-pref" placeholder="Editor preferido">
        <button id="setup-btn">Finalizar e Entrar</button>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen">
      <header class="top-bar">
        <div class="logo" id="logo">Programmer's Room</div>
        <input type="search" id="search-input" placeholder="Buscar projetos...">
        <div class="user-menu" id="user-menu">
          <img id="user-avatar" src="" alt="avatar">
          <span id="user-nick"></span>
          <div class="dropdown" id="user-dropdown">
            <button id="view-profile">Meu Perfil</button>
            <button id="my-projects">Meus Projetos</button>
            <button id="customize-ui">🎨 Personalizar UI / HUD</button>
            <button id="settings">Configurações</button>
            <button id="logout">Sair</button>
          </div>
        </div>
      </header>

      <div class="content-wrapper">
        <main id="main-content">
          <!-- Dynamic content here -->
        </main>
        <aside id="right-toolbar" class="toolbar">
          <div class="toolbar-toggle" id="toolbar-toggle">☰ Ferramentas</div>
          <div class="toolbar-panel" id="toolbar-panel">
            <h3>Ferramentas</h3>
            <button id="new-project-btn">+ Novo Projeto</button>
            <button id="local-branches">Branches Locais</button>
            <button id="insights">Insights</button>
            <button id="customize-ui-toolbar">🎨 Personalizar UI / HUD</button>
            <div id="quick-stats"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Modals / Overlays -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="src/scripts/api.js"></script>
  <script src="src/scripts/auth.js"></script>
  <script src="src/scripts/projects.js"></script>
  <script src="src/scripts/app.js"></script>
</body>
</html>
